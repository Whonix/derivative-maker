set default=0
set timeout=30

# Do not attempt to resolve font loading issues here, you *will* break the
# boot menu in various weird ways if you try.
if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

## Drive the serial console alongside gfxterm so the image boots headless through
## the real firmware -> GRUB -> kernel chain (boot-testing across BIOS / OVMF /
## OVMF Secure Boot); gfxterm keeps the graphical menu for interactive users.
## 'serial' initialises COM1 -- on a machine without a serial port GRUB just
## carries on with gfxterm. Without this GRUB's 'terminal_output gfxterm' dropped
## all output after the menu, so a serial boot-tester saw nothing past GRUB.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output gfxterm serial

insmod play
play 960 440 1 0 4 440 1

# SMBIOS cmdline reader. Runs at parse time (config.cfg is sourced at the top of
# grub.cfg), so ${dm_smbios_extra} is set before any menuentry is booted. It lets
# a boot-tester inject extra kernel cmdline through the real firmware -> GRUB ->
# kernel chain via 'qemu -smbios' ('dm-qemu --smbios-append') with no image edit.
# Read the SMBIOS Type 1 system serial number (qemu -smbios
# type=1,serial=dm-cmdline=...; offset 7 is a real string-reference field GRUB can
# read -- Type 11 OEM strings have no such field, offset 5 is past the 5-byte
# formatted area and faults) and, if it carries the 'dm-cmdline=' sentinel, expose
# the rest as ${dm_smbios_extra}, which the generated live 'linux' lines append.
# With no SMBIOS string set the reader is a no-op and ${dm_smbios_extra} stays
# empty. Shipped in-generation (no post-generation grub.cfg edit).
insmod regexp
insmod smbios
smbios --type 1 --get-string 7 --set dm_smbios_oem
regexp --set 1:dm_smbios_extra "^dm-cmdline=(.*)" "${dm_smbios_oem}"
