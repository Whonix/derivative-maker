## Expected-to-differ allowlist for reproducible-compare (diffoscope).
##
## Each non-comment line is one diffoscope '--exclude PATTERN'. A pattern
## matches diffoscope MEMBER NAMES (files inside the descended image), so it can
## suppress a whole file that is known to differ benignly and cannot yet be
## pinned at build time.
##
## POLICY -- keep this file as close to EMPTY as possible:
##   * The end goal is bit-for-bit reproducible VM images and ISOs, i.e. an
##     EMPTY allowlist. A remaining, un-allowlisted difference is the honest
##     "not reproducible yet" signal -- do not silence it here to turn the CI
##     lane green.
##   * Prefer FIXING the build over adding a pattern. Byte-region differences
##     (MBR disk signature bytes 441-444, GPT partition GUIDs, ext4 checksum
##     seed, ISO volume-descriptor timestamps) are NOT file members and cannot
##     be excluded here anyway -- pin them at build time (disk-region
##     normalization) instead.
##   * Every entry must name a concrete, benign, not-yet-fixable member and cite
##     WHY it cannot be pinned. Reviewer sign-off required. Revisit on each
##     toolchain bump; an entry that has become fixable must be removed.
##
## Format example (commented out -- there are intentionally no active entries):
##   # /etc/ssl/private/.*        # per-build private keys; not shipped, regenerated
##   # .*/var/log/.*              # build-time logs; excluded from the image anyway
##
## --- active patterns below this line (keep empty until proven necessary) ---
