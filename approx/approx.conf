# Generic snapshot.debian.org pass-through. The frozen PIN (the snapshot timestamp) is NOT
# here -- it lives in build_sources/debian_stable_frozen_clearnet.sources as a path segment
# ('.../debian-frozen/<TIMESTAMP>'), which approx forwards. Keeping approx unpinned means one
# reviewable place to bump the pin (updated by dm-maintenance) and approx stays a cache only.
debian-frozen http://snapshot.debian.org/archive/debian
debian-security-frozen http://snapshot.debian.org/archive/debian-security
tpo https://deb.torproject.org/torproject.org
ubuntu http://us.archive.ubuntu.com/ubuntu
kicksecure https://deb.kicksecure.com
whonix https://deb.whonix.org
oracle https://download.virtualbox.org/virtualbox/debian/

