---
## Sidebar UI ordering: GitHub sorts the Actions tab alphabetically
## by 'name:'. The '00 ' prefix forces this workflow to the top of
## the list because it is the first gate a change meets; operators
## should see its status first.
##
## Scope: the build DRY-RUN only. Real image builds belong to
## local-reproducible-build-test.yml (reproducibility: builds twice + diffoscope) and
## local-boot-test.yml (build + boot). Both drive
## help-steps/dm-build-official directly and need no secrets, so they
## run on forks; keeping the heavy build out of this per-PR gate also
## avoids a third copy of that build path.
name: 00 Build dry-run

on:
  pull_request:
    branches: [master]
  ## Branch-push triggers intentionally omitted: a tag-bearing commit
  ## landing on master would otherwise fire this workflow twice. Tag
  ## pushes are the canonical release trigger.
  push:
    tags:
      ## '**' not '*': '*' does not match a slash, so a slash-delimited tag
      ## would silently skip this gate while local-reproducible-build-test.yml still builds it --
      ## the expensive lane running on a commit the cheap one never checked.
      - '**'
  workflow_dispatch:

## See agents/github-actions-security.md.

permissions:
  contents: read

## Per-ref cancellation (see agents/github-actions.md G-A-006).
## github.ref is unique per PR and per tag, so each PR-N and each
## tag has its own concurrency group:
##   PR  -> refs/pull/N/merge   (one group per PR)
##   tag -> refs/tags/<tag>     (one group per tag)
## A new push on a PR cancels only that PR's in-flight run; a tag
## push cannot cancel any PR (different ref => different group);
## different PRs never cross-cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## Calls local-build-dry-run.yml as a reusable workflow
  ## (on: workflow_call) rather than giving that file its own PR
  ## trigger, so the dry-run reports under this workflow's single
  ## Actions UI record. See agents/github-actions-security.md
  ## (workflow_call section) for why we prefer 'uses: ./...' over an
  ## event-driven workflow_run trigger here.
  dry-run:
    uses: ./.github/workflows/local-build-dry-run.yml
    ## The reusable workflow only needs contents: read. Pass it
    ## explicitly so a future tightening of the parent's
    ## workflow-level permissions block does not silently strip the
    ## permission the called workflow expects.
    permissions:
      contents: read
