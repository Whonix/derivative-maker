---
name: Reproducible Build Test

## Repo-private native reproducibility lane (G-A-005 'local-' prefix): builds
## the same image TWICE as two INDEPENDENT jobs (in separate runner VMs), then a
## third job compares the two images with diffoscope via developer-meta-files'
## dm-reproducible-compare-artifacts. Every difference is reported (no allowlist).
## The two builds ARE the build test, so a green run means the image both builds
## and is reproducible.
## Kept simple -- one target per run (the default, or a workflow_dispatch choice),
## not a build-everything matrix, to avoid superfluous builds.
## The compare job's conclusion IS the reproducibility pass/fail signal: green
## == bit-for-bit reproducible, red == a difference remains.
## The diffoscope report artifact says exactly what differs. The build runs through
## the official orchestration (help-steps/dm-build-official) with a single-flavor smoke
## (kicksecure-ci-tiny-do-not-use, the flavor local-boot-test.yml also builds), so
## there is ONE build path and no duplicate build logic; all compare logic lives in
## developer-meta-files' dm-reproducible-compare-artifacts, so the shell stays
## lint-covered and locally runnable. See agents/github-actions-security.md for the
## pinning / permissions patterns.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which built image to compare. Both are built from kicksecure-ci-tiny-do-not-use, the flavor local-boot-test.yml also uses."
        type: choice
        ## A choice input defaults to the first option (qcow2); the env fallback
        ## below ('inputs.target || qcow2') covers schedule/push.
        ## 'virtualbox' exports the .ova through helper-scripts'
        ## vbox-ova-reproducible-normalize (run in-build), so the .ova build
        ## completes and the two runners' .ova are compared byte-for-byte like
        ## qcow2 / iso.
        options:
          - qcow2
          - iso
          - virtualbox
  ## Dispatch-only, plus release tags below:
  ##   dm-ci-dispatch --workflow local-reproducible-build-test.yml --ref <ref>
  push:
    tags:
      ## '**' not '*': '*' does not match a slash, so a slash-delimited tag would
      ## silently skip the gate.
      - '**'
  schedule:
    ## Weekly, Sundays 07:00 UTC (offset from the scorecard lane at 06:00 to
    ## avoid a thundering herd on the shared runner pool).
    - cron: '0 7 * * 0'

## Least privilege (rule 1): read the repo and use the Actions artifact backend
## only; deny everything else.
permissions:
  contents: read

## Per-ref cancellation (G-A-006): a new dispatch on the same ref cancels the
## in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

## Resolve the dispatch inputs once, with defaults that also apply to the
## scheduled run (where inputs are empty). Fixed to amd64: the primary
## reproducibility target; arm64 is a follow-up.
env:
  ## Default to qcow2: mountable, and the comparator descends the shipped
  ## '.qcow2.libvirt.xz'.
  REPRO_TARGET: ${{ inputs.target || 'qcow2' }}
  REPRO_ARCH: amd64
  ## The SAME flavor local-boot-test.yml builds, for every target. Two lanes on
  ## two flavors means two full builds of the same commit that can never share an
  ## artifact; agreeing on one is what lets the boot lane consume this lane's
  ## image instead of rebuilding it.
  ##
  ## kicksecure-ci-tiny-do-not-use is the minimal one that still boots: the boot,
  ## chain hardening core, systemcheck and user-sysmaint-split (both boot sessions),
  ## no GUI/browser/anonymity layer. 'dracut' comes in through ram-wipe's own
  ## Depends, so the initramfs path is present despite not being named in the
  ## meta package. What it does NOT carry -- grub-live-dracut,
  ## bootclockrandomization, boot-info-script -- is live-mode, clock-privacy and
  ## diagnostics, none of which a boot needs. The boot lane has produced green
  ## boots on this flavor, which is the evidence that matters.
  REPRO_FLAVOR: kicksecure-ci-tiny-do-not-use
  ## Build ONLY the target this run compares, not the whole 'virtualbox qcow2' set:
  ## the other is pure runner time, and the .ova leg cannot complete anyway (see the
  ## target choices above). Empty for iso, which the lxqt flavor produces on its own.
  ##
  ## Carries the SAME 'inputs.target || qcow2' fallback as REPRO_TARGET above. Reading
  ## inputs.target raw here leaves this empty on push and schedule, where no input
  ## exists, so the lane builds no VM image and fails at artifact upload with nothing
  ## to collect.
  REPRO_MULTI_TARGET_LIST: ${{ (inputs.target || 'qcow2') != 'iso' && (inputs.target || 'qcow2') || '' }}
  ## Cache the cowbuilder base chroot, as local-boot-test.yml already does. Building
  ## it is the largest fixed cost left in the lane. It is build INFRASTRUCTURE, not
  ## image content -- the same reasoning under which the docker image is already
  ## cached here -- so reusing it cannot change what the two builds are compared on.
  BASE_CACHE: "true"
  ## Parallel package builds, passed as '--package-jobs N'. 2100 falls back to
  ## serial with a reason when cowbuilder is not in use, so this needs no guard here.
  ## 2100 advises capping around nproc-2; ubuntu-24.04 runners have 4 vCPU. Both
  ## copies get the same value, so it cannot skew the a-vs-b comparison -- and
  ## nondeterminism introduced by it is what this lane exists to report.
  ##
  ## CI does not need to stay responsive, so use all runner cores. ubuntu-24.04
  ## runners have 4 vCPU. Both a/b copies get the same value, so it cannot skew
  ## the comparison.
  REPRO_PACKAGE_JOBS: "4"

jobs:
  build:
    ## Fork-PR guard (rule 3); always true for the dispatch / schedule triggers
    ## this workflow uses.
    ## CI runs only where we enabled it; ANDed with the existing guard.
    ## Unset variable -> skipped, no runner, run stays green.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        ## Two independent builds of the SAME spec. Separate matrix entries run
        ## on separate runner VMs, so 'a' and 'b' are genuinely independent
        ## rebuilds rather than one machine building twice.
        copy:
          - a
          - b
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository (no submodules yet)
        ## submodules: false so the next steps can re-target each submodule's
        ## origin URL at the fork before init.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 0
          ## rule 2: the build only signs/tags locally and never pushes.
          persist-credentials: false

      - name: Mirror Kicksecure/ and Whonix/ to ${{ github.repository_owner }}
        ## Must run BEFORE 'submodule update --init' so the rewrites are visible
        ## to the recursive clone.
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        if: github.repository_owner != 'Whonix' && github.repository_owner != 'Kicksecure'
        run: ./ci/configure-fork-mirror "${REPOSITORY_OWNER}" "${REPOSITORY_OWNER}"

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Check out matching fork branch in cross-org submodules (if present)
        ## head_ref on a fork PR is attacker-named; route it through an env var
        ## rather than inlining (actionlint).
        if: github.repository_owner != 'Whonix' && github.repository_owner != 'Kicksecure'
        env:
          FORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./ci/checkout-fork-submodule-branches "${FORK_BRANCH}"

      ## Reclaim runner disk (#96); a vbox/qcow2 dispatch has the same runner
      ## disk profile as a single build job.
      - name: Free runner disk space
        run: ./ci/free-disk

      ## Cache plumbing (proven). The two independent
      ## builds may share a warm cache; cache provenance does not affect a
      ## reproducible build's output, so this only speeds the lane up. Key
      ## includes matrix.copy so the parallel 'a'/'b' saves do not race on one
      ## cache entry.
      - name: Restore approx package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.approx-cache-sidecar
          key: ${{ runner.os }}-repro-${{ matrix.copy }}-approx-${{ hashFiles('.github/workflows/local-reproducible-build-test.yml', 'docker/derivative-maker-docker-setup', 'help-steps/dm-build-official', 'help-steps/dm-build-official-one') }}

      - name: Restore docker image cache
        id: dmimg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.dm-docker-image
          ## The frozen sources.in file is part of the key because the image's apt
          ## is pinned to the timestamp it carries: without it a snapshot bump
          ## would reuse an image built against the previous snapshot, silently
          ## restoring the mismatch the pin exists to prevent.
          key: ${{ runner.os }}-repro-${{ matrix.copy }}-dmimg-${{ hashFiles('docker/**', 'build_sources/frozen-snapshot-timestamp', 'build_sources/debian_stable_frozen_direct_clearnet.sources.in') }}

      - name: Seed approx cache from sidecar
        run: ./ci/approx-cache-sidecar seed

      - name: Load cached docker image
        if: steps.dmimg-cache.outputs.cache-hit == 'true'
        run: ./ci/dm-docker-image-cache load

      ## Cache the cowbuilder base chroot (~/binary_mnt/pbuilder/base.cow_<arch>) as a
      ## root-owned tarball, mirroring local-boot-test.yml. The key tracks the base
      ## recipe (1300 extrapackages) and the apt sources/snapshot, so a base-affecting
      ## change invalidates it and a fresh base is built.
      ##
      ## matrix.copy is IN THE KEY, like the approx and docker caches above: builds a
      ## and b must not share a cache entry, or the two halves of a reproducibility
      ## comparison stop being independent.
      - name: Restore cowbuilder base cache
        if: env.BASE_CACHE == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/cowbuilder-base-cache
          key: ${{ runner.os }}-repro-${{ matrix.copy }}-cowbase-${{ env.REPRO_ARCH }}-${{ hashFiles('build-steps.d/1300_cowbuilder-setup', 'build_sources/**', 'help-steps/mmdebstrap', 'help-steps/pbuilder-hooks/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-repro-${{ matrix.copy }}-cowbase-${{ env.REPRO_ARCH }}-${{ hashFiles('build-steps.d/1300_cowbuilder-setup', 'build_sources/**', 'help-steps/mmdebstrap', 'help-steps/pbuilder-hooks/**') }}-

      - name: Unpack cowbuilder base into place
        if: env.BASE_CACHE == 'true'
        run: ./ci/cowbuilder-base-cache unpack

      - name: Build ${{ matrix.copy }} via dm-build-official (${{ env.REPRO_FLAVOR }}, ${{ env.REPRO_ARCH }})
        id: dm-build
        ## Route the build through the OFFICIAL orchestration
        ## (help-steps/dm-build-official), the single build path: CI and the
        ## local ci/reproducible-build-twice drive the same entrypoint, so a
        ## local verdict transfers. Passed via an 'env VAR=val' prefix (the container entrypoint execs
        ## "$@", so this sets them inside the container without a docker-run change):
        ##   flavors_list=$FLAVOR         -> SINGLE-flavor smoke (the same flavor
        ##       local-boot-test.yml builds; the script honours a flavors_list
        ##       override and the release steps are flavor-aware)
        ##   dist_build_multi_target_list=$MULTI -> for an iso run, empty so only
        ##       the iso is produced; 'virtualbox qcow2' for the VM targets
        ##   dist_build_target_arch       -> pin the arch (dm-build-official-one
        ##       otherwise defaults CI to arm64)
        ## CI=true (forwarded by docker-run) makes it reproducible-from-source with
        ## uploads mocked. --freshness frozen pins the snapshot so the two
        ## independent 'a'/'b' builds see identical package versions.
        ## dm-build-official does NOT sign, and the build's sq-git check rejects an
        ## unsigned HEAD, so mint an ephemeral CI key and sign+tag HEAD FIRST
        ## -- all in ONE docker-run so signing-key-create's home state
        ## persists into sign-and-tag and the build. The ephemeral signature does not
        ## break reproducibility: dist_build_version is pinned pre-sign and the image
        ## content does not embed the commit signature.
        ## Setting dist_build_version here bypasses help-steps/variables' own detection,
        ## so this describe carries the SAME '--exclude' -- otherwise a checkout that
        ## already has an ephemeral '<tag>_<commit>_<key>' tag from an earlier signed
        ## build pins the version to that tag. Fresh in CI, not on a reused workspace.
        ## rule 4: shell vars from env, never ${{ }} interpolation into "run:".
        env:
          CI: "true"
          ARCH: ${{ env.REPRO_ARCH }}
          FLAVOR: ${{ env.REPRO_FLAVOR }}
          MULTI: ${{ env.REPRO_MULTI_TARGET_LIST }}
          FRESHNESS: frozen
          PKG_JOBS: ${{ env.REPRO_PACKAGE_JOBS }}
          ## Reusing a base the cache never restored would hand
          ## 1300_cowbuilder-setup a stale or absent tree, so the flag is tied to
          ## BASE_CACHE rather than set unconditionally.
          COWBASE_REUSE_FLAG: ${{ env.BASE_CACHE == 'true' && '--reuse-cowbuilder-base' || '' }}
        ## The memory sampler runs INSIDE this step, backgrounded, so its readings
        ## interleave into THIS step's log. A later step cannot help: when the runner
        ## dies, every subsequent step -- including 'if: failure()' and github's own
        ## post-steps -- is recorded as never having run, so the only evidence that
        ## survives is whatever already reached the log.
        run: |
          ./ci/memory-sampler 30 &
          memory_sampler_pid="$!"
          trap 'kill "${memory_sampler_pid}" 2>/dev/null || true' EXIT
          ## dist_build_unlock_dangerous_options=true: kicksecure-ci-tiny-do-not-use
          ## is a DANGEROUS flavor (parse-cmd error_dangerous_option_maybe) -- CI
          ## legitimately uses this minimal CI-only flavor, so unlock it here.
          ./docker/derivative-maker-docker-run -- bash -c "export dist_build_version=\"\$(git describe --always --abbrev=1000000000 --exclude '*_*_*')\" && export dist_build_sign_and_tag=true && export dist_build_unlock_dangerous_options=true && export dist_build_source_release_flavor='${FLAVOR}' && ./help-steps/signing-key-create && ./help-steps/sign-and-tag && env dist_build_target_arch='${ARCH}' flavors_list='${FLAVOR}' dist_build_multi_target_list='${MULTI}' ./help-steps/dm-build-official --freshness '${FRESHNESS}' --package-jobs '${PKG_JOBS}' ${COWBASE_REUSE_FLAG}"

      ## Runs only when the build FAILED but the runner survived -- e.g. a
      ## container OOM-killed inside an otherwise healthy job, where docker's
      ## OOMKilled flag is decisive. It cannot help when the runner itself dies:
      ## every step after the build, this one included, is then recorded as
      ## never having run. The in-step memory sampler above covers that case.
      - name: Diagnose a killed build
        if: failure()
        run: ./ci/diagnose-build-kill

      ## Pack the cowbuilder base into its tarball BEFORE freeing it: under
      ## --reuse-cowbuilder-base the base lives in this tree, and the upload glob
      ## below scandirs binary_mnt, where a root-owned 0700 chroot would EACCES.
      ## No-op when there is no base in the tree.
      - name: Pack cowbuilder base for cache
        if: always() && env.BASE_CACHE == 'true'
        run: ./ci/cowbuilder-base-cache pack

      - name: Free the relocated cowbuilder base tree
        if: always() && env.BASE_CACHE == 'true'
        run: ./ci/cowbuilder-base-cache free

      ## Save ONLY after a successful build. 1300_cowbuilder-setup's reuse health
      ## check is a single test -- '/dev/ptmx' is a character device -- which a
      ## partially created base can satisfy, so a base packed from a run that died
      ## during creation would restore as the newest prefix match and poison every
      ## later run. Skipping the save on failure costs one cold base; caching a
      ## broken one costs every subsequent build until someone notices.
      - name: Save cowbuilder base cache
        if: env.BASE_CACHE == 'true' && steps.dm-build.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/cowbuilder-base-cache
          key: ${{ runner.os }}-repro-${{ matrix.copy }}-cowbase-${{ env.REPRO_ARCH }}-${{ hashFiles('build-steps.d/1300_cowbuilder-setup', 'build_sources/**', 'help-steps/mmdebstrap', 'help-steps/pbuilder-hooks/**') }}-${{ github.run_id }}

      - name: Save docker image to cache
        if: steps.dmimg-cache.outputs.cache-hit != 'true'
        run: ./ci/dm-docker-image-cache save

      - name: Snapshot approx cache to sidecar
        if: always()
        run: ./ci/approx-cache-sidecar snapshot

      ## Upload only the released images, not the whole binary_mnt tree: the ~3GB
      ## intermediate 'base-image.raw' would otherwise bloat each artifact to
      ## ~4.8GB and exhaust the compare runner's disk on download. Released images
      ## are 'Kicksecure-*' (this lane builds Kicksecure flavors) while the
      ## intermediate is 'base-image.raw', so a prefix glob drops it with no
      ## per-target extension logic; the comparator then picks the exact image by
      ## extension. '**' descends the version subfolder the build writes into.
      - name: Upload build ${{ matrix.copy }} image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-image-${{ matrix.copy }}
          ## The distributable images + their sidecars, matched by EXTENSION so
          ## this works for any product (Kicksecure OR Whonix) -- image filenames
          ## are '<Product>-<flavor>-<version>...', so a 'Kicksecure-*' prefix
          ## silently drops Whonix images. Excludes the '.raw' build intermediate
          ## (a 100 GB sparse disk that is not the reproducibility subject and
          ## bloats the compare job's disk) and every build-cache dir under
          ## binary_mnt (they carry none of these extensions).
          path: |
            /home/runner/binary_mnt/**/*.qcow2.libvirt.xz
            /home/runner/binary_mnt/**/*.qcow2.libvirt.xz.*
            /home/runner/binary_mnt/**/*.iso
            /home/runner/binary_mnt/**/*.iso.*
            /home/runner/binary_mnt/**/*.ova
            /home/runner/binary_mnt/**/*.ova.*
          if-no-files-found: error
          ## 2 days, matching boot-image-*: nothing consumes these after the
          ## compare job (its only reader), so a longer window just holds
          ## storage. The report below is the durable, human-facing output.
          retention-days: 2

      ## The SOURCE tarball (derivative-maker-source-<version>.xz), emitted at
      ## Phase 4 by dm-prepare-release once dist_build_source_release_flavor is a
      ## built flavor. It is a pure function of the NORMALIZED source tree -- no
      ## host-compiled bytes -- so the two independent runners must produce it
      ## byte-identical; the compare job asserts sha256(a) == sha256(b). The name
      ## is precise, so this never catches an image '.xz'.
      - name: Upload build ${{ matrix.copy }} source tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-source-${{ matrix.copy }}
          path: /home/runner/binary_mnt/**/derivative-maker-source-*.xz
          if-no-files-found: error
          retention-days: 2

      ## The PROVENANCE record, kept far longer than the image it describes.
      ## The image artifact expires in 2 days because it is half a gigabyte and
      ## only the compare job reads it. The '.dm-buildinfo' is a few kilobytes and
      ## is what answers "what source did this run actually build?" -- the
      ## Submodule-State it carries is the only record of the branch TIPS this
      ## lane checks out instead of the commit's pins. Losing it after 2 days
      ## makes every older run unanalysable, so it is uploaded separately and
      ## retained for a quarter. Storage cost is negligible; the alternative is
      ## re-running an hour-long build to recover a few KB of metadata.
      - name: Upload build ${{ matrix.copy }} provenance record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-buildinfo-${{ matrix.copy }}
          path: |
            /home/runner/binary_mnt/**/*.dm-buildinfo
            /home/runner/binary_mnt/**/*.dm-buildinfo.asc
            /home/runner/binary_mnt/**/*.dm-buildinfo.sig
          ## A run that produced an image but no provenance record is a defect,
          ## not an empty upload to shrug at.
          if-no-files-found: error
          retention-days: 90

      ## The small VERIFICATION sidecars, uploaded WITHOUT the multi-hundred-MB
      ## image. A reproducibility check compares the '.sha512sums' -- a few
      ## hundred bytes -- so downloading the whole 'repro-image' artifact (~1.3 GB)
      ## just to read one hash line is pure waste. This bundle is ~100 KB: the
      ## per-image '.sha512sums' (+ '.asc'/'.sig'), the image signatures, and
      ## the build's auto-generated signing PUBLIC keys (5200_prepare-release
      ## exports the signify '.pub' and the OpenPGP cert next to the images) so a
      ## verifier can check the signatures without the operator's keys. Public
      ## keys only -- never a secret half. No '.torrent': CI images are not
      ## distributed over BitTorrent.
      - name: Upload build ${{ matrix.copy }} checksums, signatures and public keys
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-checksums-${{ matrix.copy }}
          ## Matched by EXTENSION, not a 'Kicksecure-*' prefix, so it also covers
          ## Whonix images. Only image sidecars and the signing public keys carry
          ## these suffixes under binary_mnt; the build-cache dirs and the big
          ## images (.qcow2.libvirt.xz / .iso) do not, so nothing large is caught.
          path: |
            /home/runner/binary_mnt/**/*.sha512sums
            /home/runner/binary_mnt/**/*.asc
            /home/runner/binary_mnt/**/*.sig
            /home/runner/binary_mnt/**/*.pub
          if-no-files-found: error
          retention-days: 90

  ## A build that DIES takes its own diagnostics with it: every step after the
  ## build -- the 'if: failure()' collector and github's own post-steps included
  ## -- is then recorded as never having run, so nothing in that job can report
  ## anything. Proven by synthetic probe: on a job that does not fail cleanly the
  ## step-level collector is SKIPPED while a separate job still runs.
  ##
  ## This job runs on a FRESH runner, so it survives. It cannot see the dead
  ## runner's memory or dmesg -- the in-step sampler covers that by writing into
  ## the log while the build is alive -- but it makes the shape of the failure
  ## EXPLICIT instead of leaving a silent mystery.
  postmortem:
    needs: build
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Report which steps never ran
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf '%s\n' "===== BUILD DID NOT SUCCEED: ${NEEDS_BUILD_RESULT} ====="
          printf '%s\n' "A step recorded as 'none' never ran. If the BUILD step is 'none'"
          printf '%s\n' "and everything after it is too, the runner died rather than the"
          printf '%s\n' "build failing -- look at the MEMSAMPLE lines in the build log."
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | "\(.name): \(.conclusion) | " + ([.steps[] | "\(.number)=\(.conclusion // "none")"] | join(","))' \
            || printf '%s\n' "api query failed"

  compare:
    needs: build
    ## Fork-PR guard (rule 3), mirroring the build job; also gated by needs:build.
    ## CI runs only where we enabled it; ANDed with the existing guard.
    ## Unset variable -> skipped, no runner, run stays green.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      ## The comparator lives in the developer-meta-files submodule
      ## (dm-reproducible-compare-artifacts + dm-reproducible-compare), so the
      ## submodule is checked out -- and, like the build job, its matching fork
      ## branch when a coordinated PR carries one.
      - name: Checkout repository (no submodules yet)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Mirror Kicksecure/ and Whonix/ to ${{ github.repository_owner }}
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        if: github.repository_owner != 'Whonix' && github.repository_owner != 'Kicksecure'
        run: ./ci/configure-fork-mirror "${REPOSITORY_OWNER}" "${REPOSITORY_OWNER}"

      - name: Initialize submodules
        run: git submodule update --init --recursive

      ## This lane runs the comparator OUT OF the submodule, so a lagging pin
      ## makes it fail wherever the older tool breaks instead of at the pin --
      ## once seen as "expected exactly one *.qcow2 ... found 0", which reads
      ## like a reproducibility failure and is not one. Report the lag itself.
      - name: Assert the developer-meta-files pin is not stale
        run: ./ci/assert-submodule-not-stale packages/kicksecure/developer-meta-files

      ## Every OTHER pin, reported but not enforced. Most dm submodules pin a
      ## deliberately older, tested revision, so a hard gate on all 80-odd would
      ## fail every run and teach everyone to ignore it. Enumerated from
      ## .gitmodules, not listed here, so a submodule added later is covered
      ## without an edit -- and the summary states how many were NOT verified,
      ## because a check that did not run must not read as a pass.
      - name: Report the freshness of every submodule pin
        run: ./ci/assert-submodule-not-stale --all --report-only

      - name: Check out matching fork branch in cross-org submodules (if present)
        if: github.repository_owner != 'Whonix' && github.repository_owner != 'Kicksecure'
        env:
          FORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./ci/checkout-fork-submodule-branches "${FORK_BRANCH}"

      ## Same disk reclaim as the build jobs (#96): the compare downloads two
      ## images and builds the derivative-maker container image.
      - name: Free runner disk space
        run: ./ci/free-disk

      - name: Download image A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-image-a
          path: build-a

      - name: Download image B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-image-b
          path: build-b

      - name: Download source tarball A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-source-a
          path: source-a

      - name: Download source tarball B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-source-b
          path: source-b

      ## Run the comparison in the SAME derivative-maker Debian container as the
      ## build (consistency + clean layering), not bare on the runner: the source
      ## tree and the downloaded build-a / build-b bind-mount into the container,
      ## where ci/reproducible-compare installs diffoscope and runs the comparator.
      ## Exit code IS the pass/fail: 0 reproducible, 1 differs (report written),
      ## 2 environment error; a remaining difference fails the job on purpose.
      - name: Compare images in the derivative-maker container
        env:
          REPORT: reproducible-report.html
          TARGET: ${{ env.REPRO_TARGET }}
        run: ./docker/derivative-maker-docker-run -- ci/reproducible-compare --target "${TARGET}" --dir-a build-a --dir-b build-b --output "${REPORT}"

      ## The SOURCE tarball reproducibility verdict: a pure sha256/byte compare of
      ## the two runners' derivative-maker-source-*.xz. A source tarball has no
      ## host-compiled bytes, so any difference is a real normalize/tar
      ## nondeterminism. 'if: always()' so it reports even when the image compare
      ## above already failed -- the two are independent verdicts.
      - name: Compare source tarballs byte-for-byte
        if: always()
        run: ./ci/compare-source-tarballs source-a source-b

      - name: Upload diffoscope report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-report
          path: reproducible-report.html
          if-no-files-found: warn
          retention-days: 14
