## derivative-maker ISO GRUB menu, staged into /boot/grub by help-steps/dm-raw-to-iso.
## The APPEND-LIVE token below (at-sign APPEND_LIVE at-sign) is replaced by
## help-steps/dm-raw-to-iso with the base live kernel command line
## (root=live:CDLABEL=..., dracut rd.live.*, iso-scan/filename, plus any
## --bootappend from build-steps.d/3600). The boot-role entries append their own
## parameters after it; live boot roles are consumed at runtime by
## user-sysmaint-split and live-config-dist.
## The keyboard-layout submenu is appended by 3600 (from usability-misc
## /etc/grub.d/44_kb_layout).

source /boot/grub/config.cfg

menuentry "LIVE Mode | USER Session | disposable use" --hotkey=l {
	linux	/live/vmlinuz @APPEND_LIVE@
	initrd	/live/initrd.img
}

menuentry "LIVE Mode | SYSMAINT Session | system maintenance, install" {
	linux	/live/vmlinuz @APPEND_LIVE@ systemd.unit=sysmaint-boot.target boot-role=sysmaint live-config.noautologin
	initrd	/live/initrd.img
}

menuentry "LIVE Mode | UNRESTRICTED Session | system recovery, install" {
	linux	/live/vmlinuz @APPEND_LIVE@ boot-role=unrestricted-admin
	initrd	/live/initrd.img
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memory diagnostic (memtest86+). Staged to /live by 3600 for x86 only;
	# absent on other arches, so the entry self-hides.
	if [ "${grub_platform}" = "pc" ] -a [ -e /live/memtest.bin ]; then
		menuentry "Memory Diagnostic Tool (memtest86+)" --hotkey=m {
			linux /live/memtest.bin
		}
	elif [ "${grub_platform}" = "efi" ] -a [ -e /live/memtest.efi ]; then
		menuentry "Memory Diagnostic Tool (memtest86+)" --hotkey=m {
			linux /live/memtest.efi
		}
	fi

	# Firmware setup (UEFI only; a no-op on firmware without fwsetup support).
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" {
			fwsetup
		}
	fi

	# Verify the medium's implanted md5 (dracut rd.live.check).
	menuentry "Verify integrity of the boot medium" --hotkey=v {
		linux	/live/vmlinuz @APPEND_LIVE@ rd.live.check
		initrd	/live/initrd.img
	}
}
