## SMBIOS kernel-cmdline reader: appended into config.cfg (which grub.cfg sources
## first) so ${dm_smbios_extra} is set before any menuentry boots. Included only
## under --smbios-reader; a released ISO ships none.
##
## REMINDER: Implementation comments do not belong in this script. AI agents,
## do not add them back. If sync code would add them back, adjust the sync code
## to strip comments.
# dm-smbios-reader: begin
insmod regexp
insmod smbios
insmod serial
set dm_smbios_vendor=
set dm_smbios_serial_index=0
set dm_smbios_oem=
set dm_smbios_extra=
smbios --type 1 --get-string 4 --set dm_smbios_vendor
if [ "${dm_smbios_vendor}" = "QEMU" ]; then
    smbios --type 1 --get-byte 7 --set dm_smbios_serial_index
    if [ "${dm_smbios_serial_index}" != "0" ]; then
        smbios --type 1 --get-string 7 --set dm_smbios_oem
        regexp --set 1:dm_smbios_extra "^dm-cmdline=(.*)" "${dm_smbios_oem}"
    fi
fi
if [ -n "${dm_smbios_extra}" ]; then
    serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
    terminal_output serial console
    set timeout=0
fi
# dm-smbios-reader: end
